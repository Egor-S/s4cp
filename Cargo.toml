[package]
name = "s4cp"
version = "3.0.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive", "env"] }
cron = "0.17.0"
env_logger = { version = "0.11.11", default-features = false }
hmac = "0.13.0"
log = "0.4.34"
quick-xml = "0.42.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.0.0"
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
twox-hash = { version = "2.1.5", default-features = false, features = ["xxhash3_64", "xxhash3_128", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
webpki-roots = "1.0.9"
zstd = "0.14.2"
[profile.dev]
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
